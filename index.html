<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Swarm of Biz — a swarm of business cards.">
  <title>Swarm of Biz — SoB</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="./" aria-label="Swarm of Biz home">
      <span class="brand-line">SoB <span class="bee" role="img" aria-label="Crying bee">🐝</span></span>
      <span class="brand-sub">Swarm of Biz</span>
    </a>
    <p class="tagline">A swarm of business cards.</p>
    <p class="submit"><a href="mailto:swarmofbiz@gmail.com?subject=Submit%20your%20business%20card">Submit your card</a></p>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="Services navigation">
      <nav id="categories"></nav>
    </aside>
    <main class="content" id="main">
      <h1 id="page-title">Recent</h1>
      <div id="cards" class="cards" aria-live="polite"></div>
      <p id="status" class="status">Loading cards…</p>
    </main>
  </div>
  <footer><a href="mailto:swarmofbiz@gmail.com?subject=Contact%20Swarm%20of%20Biz">Contact</a></footer>
  <dialog id="lightbox" class="lightbox" aria-label="Business card enlarged view">
    <button id="close-lightbox" class="close-lightbox" type="button" aria-label="Close enlarged card">×</button>
    <img id="lightbox-image" alt="">
  </dialog>
  <script src="script.js"></script>
</body>
</html>
